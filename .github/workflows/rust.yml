name: Rust

# Pushes to main run the cheap checks and the tests on 64-bit and 32-bit Linux.
# Pull requests, manual runs (`gh workflow run Rust`) and `v*` tags add Windows and macOS.
on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths-ignore: [ "**.md", "LICENSE" ]
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ "**.md", "LICENSE" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: check rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install stable Rust
      run: rustup update stable && rustup default stable && rustup component add rustfmt
    - run: cargo fmt --all --check

  clippy:
    name: check clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install stable Rust
      run: rustup update stable && rustup default stable && rustup component add clippy
    - run: cargo clippy --workspace --all-targets -- -D warnings

  docs:
    name: check docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
    - uses: actions/checkout@v4
    - name: Install stable Rust
      run: rustup update stable && rustup default stable
    - run: cargo doc --workspace --no-deps

  msrv:
    name: check msrv
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install the minimum supported Rust (`rust-version` in reacs/Cargo.toml)
      run: |
        msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' reacs/Cargo.toml)
        test -n "$msrv" || { echo "::error::no rust-version in reacs/Cargo.toml"; exit 1; }
        echo "MSRV $msrv"
        rustup toolchain install "$msrv" --profile minimal && rustup default "$msrv"
    - run: cargo check --workspace --all-targets --all-features

  test:
    name: test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')) && '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"},{"os":"ubuntu-latest","target":"i686-unknown-linux-gnu"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc"},{"os":"macos-latest","target":"aarch64-apple-darwin"}]' || '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"},{"os":"ubuntu-latest","target":"i686-unknown-linux-gnu"}]') }}

    runs-on: ${{ matrix.os }}

    env:
      REACS_DETERMINISM_DIR: ${{ github.workspace }}/determinism

    steps:
    - uses: actions/checkout@v4
    - name: Install stable Rust
      run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}
    - name: Install the 32-bit C libraries
      if: matrix.target == 'i686-unknown-linux-gnu'
      run: sudo apt-get update && sudo apt-get install -y gcc-multilib
    - name: Run tests
      run: cargo test --workspace --target ${{ matrix.target }} --verbose
    - name: Run tests (release)
      run: cargo test --workspace --target ${{ matrix.target }} --release --verbose
    - name: Upload the session hashes
      uses: actions/upload-artifact@v4
      with:
        name: determinism-${{ matrix.target }}
        path: determinism/
        retention-days: 7

  determinism:
    needs: test
    runs-on: ubuntu-latest
    env:
      EXPECTED_FILES: ${{ (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')) && 8 || 4 }}

    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: determinism-*
        path: determinism
    - name: Compare the session hashes of every target and build
      shell: python3 {0}
      run: |
        import os, pathlib, sys
        files = sorted(pathlib.Path("determinism").rglob("*.txt"))
        print("\n".join(str(f) for f in files))
        expected = int(os.environ["EXPECTED_FILES"])
        if len(files) != expected:
            sys.exit(f"expected {expected} files (debug and release per target), found {len(files)}")
        reference = files[0].read_text().splitlines()
        failed = False
        for f in files[1:]:
            lines = f.read_text().splitlines()
            for a, b in zip(reference, lines):
                if a != b:
                    tick = a.split()[0]
                    old = dict(t.split("=", 1) for t in a.split()[1:] if "=" in t)
                    new = dict(t.split("=", 1) for t in b.split()[1:] if "=" in t)
                    keys = sorted(set(old) | set(new))
                    diff = [k for k in keys if old.get(k) != new.get(k)]
                    print(f"::error::{f} differs from {files[0]} first at tick {tick}: {', '.join(diff)}")
                    failed = True
                    break
            else:
                if len(lines) != len(reference):
                    print(f"::error::{f} has {len(lines)} lines, {files[0]} has {len(reference)}")
                    failed = True
        if failed:
            sys.exit(1)
        print("every target and build gave the same hashes on every tick")
