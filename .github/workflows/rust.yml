name: Rust

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths-ignore: [ "**.md", "LICENSE" ]
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ "**.md", "LICENSE" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}

    runs-on: ${{ matrix.os }}

    env:
      REACS_DETERMINISM_DIR: ${{ github.workspace }}/determinism

    steps:
    - uses: actions/checkout@v4
    - name: Install stable Rust
      run: rustup update stable && rustup default stable
    - name: Build
      run: cargo build --workspace --verbose
    - name: Run tests
      run: cargo test --workspace --verbose
    - name: Run tests (release)
      run: cargo test --workspace --release --verbose
    - name: Upload the session hashes
      uses: actions/upload-artifact@v4
      with:
        name: determinism-${{ matrix.os }}
        path: determinism/
        retention-days: 7

  determinism:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: determinism-*
        path: determinism
    - name: Compare the session hashes of every OS and build
      shell: python3 {0}
      run: |
        import pathlib, sys
        files = sorted(pathlib.Path("determinism").rglob("*.txt"))
        print("\n".join(str(f) for f in files))
        if len(files) != 6:
            sys.exit(f"expected 6 files (3 OSes, debug and release), found {len(files)}")
        reference = files[0].read_text().splitlines()
        failed = False
        for f in files[1:]:
            lines = f.read_text().splitlines()
            for a, b in zip(reference, lines):
                if a != b:
                    tick = a.split()[0]
                    old = dict(t.split("=", 1) for t in a.split()[1:] if "=" in t)
                    new = dict(t.split("=", 1) for t in b.split()[1:] if "=" in t)
                    keys = sorted(set(old) | set(new))
                    diff = [k for k in keys if old.get(k) != new.get(k)]
                    print(f"::error::{f} differs from {files[0]} first at tick {tick}: {', '.join(diff)}")
                    failed = True
                    break
            else:
                if len(lines) != len(reference):
                    print(f"::error::{f} has {len(lines)} lines, {files[0]} has {len(reference)}")
                    failed = True
        if failed:
            sys.exit(1)
        print("every OS and build gave the same hashes on every tick")
