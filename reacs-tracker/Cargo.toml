[package]
name = "reacs-tracker"
version = "0.1.0"
edition = "2024"
description = "Debug tools for reacs games: replay, snapshots and the tracker window"
license = "Apache-2.0"

[dependencies]
reacs = { path = "../reacs" }
eframe = { version = "0.37", optional = true }

[features]
default = ["window"]
window = ["dep:eframe"]

[[bin]]
name = "reacs-tracker"
path = "src/main.rs"
required-features = ["window"]
