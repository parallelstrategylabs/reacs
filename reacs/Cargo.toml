[package]
name = "reacs"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "A reactive, signal-driven ECS on a deterministic, tick-based simulation kernel"
license = "Apache-2.0"
repository = "https://github.com/parallelstrategylabs/reacs"
readme = "../README.md"
links = "reacs"

[dependencies]
reacs-derive = { path = "../derive", version = "=0.3.0" }
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }

[features]
invariants = []
