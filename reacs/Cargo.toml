[package]
name = "reacs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A reactive, signal-driven ECS on a deterministic, tick-based simulation kernel"
license = "Apache-2.0"
links = "reacs"

[dependencies]
reacs-derive = { path = "../derive", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
ctor = "1"

[features]
invariants = []
