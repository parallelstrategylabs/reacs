[package]
name = "reacs"
version = "0.1.0"
edition = "2024"
description = "A deterministic, push-based reactive ECS for simulation and game logic"
license = "Apache-2.0"

[dependencies]
reacs-derive = "0.1.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
ctor = "0.2"

[alias]
test = "test -- --test-threads=1"