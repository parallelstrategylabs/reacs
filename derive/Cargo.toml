[package]
name = "reacs-derive"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Macros for reacs"
license = "Apache-2.0"
repository = "https://github.com/parallelstrategylabs/reacs"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
sha2 = "0.10"
uuid = { version = "1.26.1", features = ["v5"] }
serde = { version = "1.0", features = ["derive"] }
proc-macro2 = "1.0"

[dev-dependencies]
reacs = { path = "../reacs" }
